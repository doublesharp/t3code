name: Cargo Steward benchmark

on:
  push:
    branches: [bench/cargo-steward-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: ${{ matrix.label }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            host: x86_64-unknown-linux-gnu
            checksum: 33e908961513f374108b39cac1f15929e741fe5c311ee28764eedf0556e028a0
          - label: Linux arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            host: aarch64-unknown-linux-gnu
            checksum: 999e64f5533c8d089d8e3f8a4ba3c030597f257a55f9fc516a986cda40d79069
          - label: Windows x64 cross-build
            runner: ubuntu-24.04
            target: x86_64-pc-windows-msvc
            host: x86_64-unknown-linux-gnu
            checksum: 33e908961513f374108b39cac1f15929e741fe5c311ee28764eedf0556e028a0
    runs-on: ${{ matrix.runner }}
    env:
      BENCH_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            native
            .github/scripts

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install checksum-verified Steward 0.2.0
        env:
          STEWARD_HOST: ${{ matrix.host }}
          STEWARD_SHA256: ${{ matrix.checksum }}
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/steward-bin"
          mkdir -p "$install_dir"
          archive="$RUNNER_TEMP/cargo-steward.tar.gz"
          curl --fail --location --retry 2 "https://github.com/0xdoublesharp/cargo-steward/releases/download/v0.2.0/cargo-steward-${STEWARD_HOST}.tar.gz" -o "$archive"
          echo "$STEWARD_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/cargo-steward" --version

      - name: Install cargo-xwin
        if: contains(matrix.target, 'windows')
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-xwin@0.23.1

      - name: Record versions
        run: |
          rustc -vV
          cargo --version
          cargo-steward --version
          uname -a

      - name: Measure three paired trials
        run: python3 .github/scripts/cargo-steward-benchmark.py

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: steward-benchmark-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/steward-benchmark/results.json
            ${{ runner.temp }}/steward-benchmark/*.log
          retention-days: 7
